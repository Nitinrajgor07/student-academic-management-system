<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body {
            background: var(--bg-primary);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-card {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: white;
            font-size: 32px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-family: 'Outfit', sans-serif;
        }

        .email {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            text-align: left;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 20px;
        }

        .info-item label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="glass-card profile-card">
        <div class="avatar">{{ student.name[0].upper() if student and student.name else '?' }}</div>
        <h2>{{ student.name if student else 'Student Dashboard' }}</h2>
        <p class="email">{{ student.email if student else '' }}</p>
        
        <div class="info-grid">
            <div class="info-item">
                <label>Course</label>
                <span>{{ student.course if student else '—' }}</span>
            </div>
            <div class="info-item">
                <label>Marks</label>
                <span>{{ student.marks if student else '—' }}</span>
            </div>
        </div>
    </div>
</body>
</html>
