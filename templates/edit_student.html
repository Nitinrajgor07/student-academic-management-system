<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body {
            background: var(--bg-primary);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.6);
            color: var(--accent-primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-1px);
        }

        .card-title-custom {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group.span-2 {
            grid-column: span 2;
        }

        /* Submit */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .submit-btn {
            flex: 1;
            height: 48px;
            font-weight: 700;
        }

        .cancel-btn {
            height: 48px;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-primary);
        }

        /* required star */
        .req { color: var(--error); margin-left: 2px; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.span-2 { grid-column: span 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h2>✏️ Edit Student — {{ s[1] }}</h2>
        <a href="/admin" class="back-btn">← Back</a>
    </div>
    <form method="POST">

        <!-- PERSONAL INFO -->
        <div class="glass-card" style="margin-bottom: 20px;">
            <div class="card-title-custom">👤 Personal Information</div>
            <div class="form-grid">

                <!-- s[1]=name -->
                <div class="form-group">
                    <label class="form-label">Full Name <span class="req">*</span></label>
                    <input class="input-modern" type="text" name="name" value="{{ s[1] }}" required>
                </div>

                <!-- s[15]=enrollment_no -->
                <div class="form-group">
                    <label class="form-label">Enrollment No <span class="req">*</span></label>
                    <input class="input-modern" type="text" name="enrollment_no" value="{{ s[15] if s[15] else '' }}" required>
                </div>

                <!-- s[2]=email -->
                <div class="form-group">
                    <label class="form-label">Email <span class="req">*</span></label>
                    <input class="input-modern" type="email" name="email" value="{{ s[2] }}" required>
                </div>

                <!-- s[12]=phone -->
                <div class="form-group">
                    <label class="form-label">Phone <span class="req">*</span></label>
                    <input class="input-modern" type="tel" name="phone" value="{{ s[12] if s[12] else '' }}" required>
                </div>

                <!-- s[13]=dob -->
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input class="input-modern" type="date" name="dob" value="{{ s[13] if s[13] else '' }}">
                </div>

                <!-- s[14]=gender -->
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select class="input-modern" name="gender">
                        <option value="">-- Select --</option>
                        <option value="Male"   {% if s[14] == 'Male'   %}selected{% endif %}>Male</option>
                        <option value="Female" {% if s[14] == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other"  {% if s[14] == 'Other'  %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <!-- s[18]=address -->
                <div class="form-group span-2">
                    <label class="form-label">Address</label>
                    <textarea class="input-modern" name="address" style="resize: vertical; min-height: 80px;">{{ s[18] if s[18] else '' }}</textarea>
                </div>

            </div>
        </div>

        <!-- ACADEMIC INFO -->
        <div class="glass-card" style="margin-bottom: 20px;">
            <div class="card-title-custom">🎓 Academic Information</div>
            <div class="form-grid">

                <!-- s[3]=course -->
                <div class="form-group">
                    <label class="form-label">Course <span class="req">*</span></label>
                    <select class="input-modern" name="course" required>
                        <option value="M.Sc Computer Science" {% if s[3] == 'M.Sc Computer Science' or s[3] == 'M.Sc CS & IT' %}selected{% endif %}>M.Sc Computer Science</option>
                        <option value="MCA"          {% if s[3] == 'MCA'          %}selected{% endif %}>MCA</option>
                        <option value="BCA"          {% if s[3] == 'BCA'          %}selected{% endif %}>BCA</option>
                        <option value="B.Tech"       {% if s[3] == 'B.Tech'       %}selected{% endif %}>B.Tech</option>
                    </select>
                </div>

                <!-- s[16]=semester -->
                <div class="form-group">
                    <label class="form-label">Semester</label>
                    <select class="input-modern" name="semester">
                        {% for i in range(1, 9) %}
                        <option value="{{ i }}" {% if s[16] == i %}selected{% endif %}>Semester {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- s[5]=password -->
                <div class="form-group">
                    <label class="form-label">Password <span class="req">*</span></label>
                    <input class="input-modern" type="text" name="password" value="{{ s[5] }}" required>
                </div>

            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-modern btn-primary submit-btn">💾 Update Student</button>
            <a href="/admin" class="cancel-btn">Cancel</a>
        </div>

    </form>
</div>
</body>
</html>
