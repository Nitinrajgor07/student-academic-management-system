<!-- ============================================================
     SIDEBAR PARTIAL — include in any student page with:
     Requires: current page sets `active_page` variable for highlighting (optional)
     ============================================================ -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
<style>
    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .sidebar-brand .brand-icon {
        font-size: 20px;
    }

    .sidebar-brand .brand-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        color: var(--text-primary);
        font-size: 16px;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    .nav-link, .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        margin-bottom: 6px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        transition: var(--transition);
        border: 1px solid transparent;
    }
    
    .nav-link .nl-left, .nav-toggle .nl-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .nav-link:hover, .nav-toggle:hover {
        background: rgba(255, 255, 255, 0.7);
        color: var(--text-primary);
        border-color: rgba(255, 255, 255, 0.4);
    }
    
    .nav-link.active, .nav-toggle.active {
        background: var(--accent-gradient);
        color: var(--text-on-accent);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        font-weight: 600;
    }
    
    .chevron {
        transition: transform 0.2s;
        font-size: 11px;
    }
    
    .nav-toggle.open .chevron {
        transform: rotate(180deg);
    }

    .submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        padding-left: 12px;
    }
    
    .submenu.open {
        max-height: 600px;
    }
    
    .submenu .nav-link {
        font-size: 13px;
        padding: 10px 14px;
        margin-bottom: 4px;
    }
</style>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<div class="layout">
    <div class="sidebar" id="main-sidebar" role="navigation" aria-label="Main navigation">
        <!-- Prevent layout flash on load by reading state immediately -->
        <script>
            if (localStorage.getItem('sidebar_collapsed') === '1') {
                document.currentScript.parentElement.classList.add('collapsed');
            }
        </script>

        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="brand-icon">🎓</span>
                <span class="brand-text">Student Portal</span>
            </div>
            <button class="sidebar-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()">
                <span class="toggle-icon">◀</span>
            </button>
        </div>

        <nav aria-label="Site pages">
        <a href="/student_dashboard" class="nav-link {{ 'active' if active_page=='dashboard' }}" data-tooltip="Dashboard" {% if active_page=='dashboard' %}aria-current="page"{% endif %}>
            <span class="nl-left">
                <span class="nav-icon" aria-hidden="true">🏠</span>
                <span class="nav-text">Dashboard</span>
            </span>
        </a>

        <!-- ACADEMICS -->
        <div class="nav-toggle {{ 'open active' if active_page in ['timetable','attendance','student_marks'] }}" onclick="toggleMenu('academics')" data-tooltip="Academics">
            <span class="nl-left">
                <span class="nav-icon">📖</span>
                <span class="nav-text">Academics</span>
            </span>
            <span class="chevron">▾</span>
        </div>
        <div class="submenu {{ 'open' if active_page in ['timetable','attendance','student_marks'] }}" id="menu-academics">
            <a href="/timetable" class="nav-link {{ 'active' if active_page=='timetable' }}">📅 Class Time Table</a>
            <a href="/student_attendance" class="nav-link {{ 'active' if active_page=='attendance' }}">📊 Class Attendance</a>
            <a href="/student_marks" class="nav-link {{ 'active' if active_page=='student_marks' }}">📈 Semester Result</a>
        </div>

        <!-- FEES -->
        <a href="/fees" class="nav-link {{ 'active' if active_page=='fees' }}" data-tooltip="Fee Payment">
            <span class="nl-left">
                <span class="nav-icon">💳</span>
                <span class="nav-text">Fee Payment</span>
            </span>
        </a>

        <!-- NOTICE BOARD -->
        <a href="/notices" class="nav-link {{ 'active' if active_page=='notices' }}" data-tooltip="Notice Board">
            <span class="nl-left">
                <span class="nav-icon">📢</span>
                <span class="nav-text">Notice Board</span>
            </span>
        </a>

        <!-- CERTIFICATES -->
        <a href="/certificates" class="nav-link {{ 'active' if active_page=='certificates' }}" data-tooltip="Certificates">
            <span class="nl-left">
                <span class="nav-icon">🎖️</span>
                <span class="nav-text">Certificates</span>
            </span>
        </a>

        <!-- PLACEMENTS -->
        <a href="/vacancies" class="nav-link {{ 'active' if active_page=='vacancies' }}" data-tooltip="Vacancy Board">
            <span class="nl-left">
                <span class="nav-icon">💼</span>
                <span class="nav-text">Vacancy Board</span>
            </span>
        </a>

        <a href="/logout" class="nav-link" style="margin-top: auto; color: var(--error);" data-tooltip="Logout" aria-label="Sign out">
            <span class="nl-left">
                <span class="nav-icon" aria-hidden="true">🚪</span>
                <span class="nav-text">Logout</span>
            </span>
        </a>
        </nav>
    </div>

    <div class="main-content">
        {% include 'topbar.html' %}

<script>
function toggleMenu(name) {
    const sidebar = document.querySelector('.sidebar');
    if (sidebar.classList.contains('collapsed')) {
        toggleSidebar();
    }
    const menu = document.getElementById('menu-' + name);
    const toggle = menu.previousElementSibling;
    menu.classList.toggle('open');
    toggle.classList.toggle('open');
}

function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const isCollapsed = sidebar.classList.toggle('collapsed');
    localStorage.setItem('sidebar_collapsed', isCollapsed ? '1' : '0');
}

/* Mobile sidebar helpers */
function openMobileSidebar() {
    document.getElementById('main-sidebar').classList.add('mobile-open');
    document.getElementById('sidebar-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    document.getElementById('main-sidebar').classList.remove('mobile-open');
    document.getElementById('sidebar-overlay').classList.remove('active');
    document.body.style.overflow = '';
}
</script>
