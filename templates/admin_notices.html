<!DOCTYPE html>
<html>
<head>
    {% include 'base_head.html' %}
    <title>Admin - Notices</title>
    <style>
        .page-header {
            margin-bottom: 24px;
        }

        .page-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-submit {
            height: 42px;
            font-weight: 700;
            padding: 0 24px;
            margin-top: 18px;
        }

        .notice-row {
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }
        
        .notice-row:hover {
            transform: translateY(-1px);
        }

        .notice-title {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 15px;
            font-family: 'Outfit', sans-serif;
        }

        .notice-meta {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 4px;
            font-weight: 500;
        }

        .del-btn {
            color: var(--error);
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }
        .del-btn:hover {
            background: var(--error-bg);
        }

        .category-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
            margin-left: 6px;
            display: inline-flex;
            vertical-align: middle;
        }
        
        .cat-General { background: rgba(79, 70, 229, 0.08); color: var(--accent-primary); border: 1px solid rgba(79, 70, 229, 0.15); }
        .cat-Exam { background: rgba(245, 158, 11, 0.08); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.15); }
        .cat-Event { background: rgba(34, 197, 94, 0.08); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.15); }
        .cat-Urgent { background: rgba(239, 68, 68, 0.08); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.15); }
    </style>
</head>
<body>
{% set active_page = 'notices' %}
{% include 'admin_sidebar.html' %}

<div class="page-header">
    <h2>📢 University Notice Board Configuration</h2>
</div>

<div class="glass-card" style="margin-bottom: 24px;">
    <div class="card-title" style="font-size: 12px; font-weight: 700; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05);">Post New Notice</div>
    <form method="POST" action="/admin_notices">
        <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label">Notice Title</label>
            <input class="input-modern" type="text" name="title" placeholder="e.g. End Semester Exam Schedule" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label">Notice Message Details</label>
            <textarea class="input-modern" name="message" style="resize: vertical; min-height: 80px;" placeholder="Write notice details here..." required></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Category / Urgency Level</label>
            <select class="input-modern" name="category">
                <option value="General">General</option>
                <option value="Exam">Exam</option>
                <option value="Event">Event</option>
                <option value="Urgent">Urgent</option>
            </select>
        </div>
        
        <button type="submit" class="btn-modern btn-primary btn-submit">Post Announcement</button>
    </form>
</div>

<div class="glass-card" style="padding: 0; background: transparent; border: none; backdrop-filter: none; box-shadow: none;">
    <div class="card-title" style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;">Currently Posted Notices</div>
    {% for n in notices %}
    <div class="glass-card notice-row">
        <div>
            <div class="notice-title">
                {{ n[1] }} 
                <span class="category-badge cat-{{ n[3] }}">{{ n[3] }}</span>
            </div>
            <div class="notice-meta">🕒 Posted on: {{ n[4] }}</div>
        </div>
        <a class="del-btn" href="/admin/delete_notice/{{ n[0] }}" onclick="return confirm('Are you sure you want to delete this notice?')">🗑️ Delete</a>
    </div>
    {% endfor %}
</div>

</div></div>
</body>
</html>
