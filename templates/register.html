<!DOCTYPE html>
<html>
<head>
    <title>Register Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 24px;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            margin-top: 10px;
            height: 46px;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

<div class="glass-card register-box">
    <div class="logo">🎓 SMS Admin</div>
    <h2>Register</h2>

    <form method="POST">
        <div class="form-group" style="text-align: left;">
            <label class="form-label">First Name</label>
            <input type="text" name="name" class="input-modern" placeholder="John" required>
        </div>

        <div class="form-group" style="text-align: left;">
            <label class="form-label">Last Name</label>
            <input type="text" name="lastname" class="input-modern" placeholder="Doe" required>
        </div>

        <div class="form-group" style="text-align: left;">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="input-modern" placeholder="admin@university.com" required autocomplete="email">
        </div>

        <div class="form-group" style="text-align: left;">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="input-modern" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-modern btn-primary btn-submit">Register</button>
    </form>

    <a href="/" class="back-link">← Cancel and Go Back</a>
</div>

</body>
</html>
