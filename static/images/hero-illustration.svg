<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="inner-shadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.03" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Master Canvas Panel -->
  <rect x="15" y="15" width="470" height="350" rx="20" fill="url(#glass-grad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#drop-shadow)" />

  <!-- Header Bar -->
  <g transform="translate(15, 15)">
    <!-- Browser window control dots -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="35" cy="20" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="50" cy="20" r="5" fill="#22c55e" opacity="0.8" />
    
    <!-- Header title bar mockup -->
    <rect x="75" y="10" width="120" height="20" rx="6" fill="#ffffff" fill-opacity="0.4" />
    <text x="85" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#4f46e5" opacity="0.8">STUDENT PORTAL</text>
    
    <rect x="205" y="10" width="150" height="20" rx="6" fill="#ffffff" fill-opacity="0.25" />
    <text x="215" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">🔍 Search analytics...</text>
    
    <!-- Profile avatar badge -->
    <circle cx="435" cy="20" r="11" fill="url(#accent-grad-1)" />
    <text x="435" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
  </g>

  <!-- Inner Content Dashboard Grid -->
  <g transform="translate(30, 60)">
    <!-- Column 1: Profile Summary Card (Left) -->
    <rect x="0" y="0" width="130" height="285" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- User Avatar Circle -->
    <circle cx="65" cy="50" r="28" fill="#ffffff" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.15" stroke-width="3" />
    <circle cx="65" cy="50" r="24" fill="url(#accent-grad-1)" opacity="0.9" />
    <text x="65" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">JD</text>
    
    <!-- User Meta Details -->
    <text x="65" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">John Doe</text>
    <text x="65" y="107" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">ID: #JURSC-9492</text>
    
    <!-- Section Divider Line -->
    <line x1="15" y1="120" x2="115" y2="120" stroke="#e2e8f0" stroke-opacity="0.3" stroke-width="1" />

    <!-- Details block list -->
    <g transform="translate(15, 135)">
      <!-- Item 1: GPA -->
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#ffffff" fill-opacity="0.4" />
      <text x="8" y="11" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b">OVERALL GPA</text>
      <text x="8" y="21" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#4f46e5">9.24 / 10</text>
      
      <!-- Item 2: Attendance -->
      <rect x="0" y="32" width="100" height="26" rx="6" fill="#ffffff" fill-opacity="0.4" />
      <text x="8" y="43" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b">ATTENDANCE</text>
      <text x="8" y="53" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#06b6d4">91.6%</text>

      <!-- Item 3: Status -->
      <rect x="0" y="64" width="100" height="26" rx="6" fill="#ffffff" fill-opacity="0.4" />
      <text x="8" y="75" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b">STATUS</text>
      <text x="8" y="85" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#22c55e">ACTIVE</text>
    </g>

    <!-- Column 2: Dashboard Content Pane (Right) -->
    <!-- KPI Row -->
    <g transform="translate(145, 0)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="90" height="45" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b" font-weight="700">COMPLETED</text>
      <text x="10" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b">12 / 14</text>
      <rect x="68" y="8" width="14" height="14" rx="4" fill="#4f46e5" fill-opacity="0.1" />
      <text x="75" y="18" font-size="9" text-anchor="middle">📝</text>

      <!-- KPI 2 -->
      <rect x="102" y="0" width="90" height="45" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="112" y="16" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b" font-weight="700">CERTIFICATES</text>
      <text x="112" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b">3 Approved</text>
      <rect x="170" y="8" width="14" height="14" rx="4" fill="#06b6d4" fill-opacity="0.1" />
      <text x="177" y="18" font-size="9" text-anchor="middle">🎖️</text>

      <!-- KPI 3 -->
      <rect x="204" y="0" width="90" height="45" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="214" y="16" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b" font-weight="700">PLACEMENTS</text>
      <text x="214" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b">Eligible</text>
      <rect x="272" y="8" width="14" height="14" rx="4" fill="#22c55e" fill-opacity="0.1" />
      <text x="279" y="18" font-size="9" text-anchor="middle">💼</text>
    </g>

    <!-- Visual Charts Pane -->
    <g transform="translate(145, 60)">
      <!-- Line Chart Card (Enrollments/GPA Trend) -->
      <rect x="0" y="0" width="186" height="110" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569">GPA TREND (SEMESTER OUTCOMES)</text>
      
      <!-- Chart grid lines -->
      <line x1="20" y1="40" x2="170" y2="40" stroke="#e2e8f0" stroke-opacity="0.15" stroke-dasharray="2 2" />
      <line x1="20" y1="60" x2="170" y2="60" stroke="#e2e8f0" stroke-opacity="0.15" stroke-dasharray="2 2" />
      <line x1="20" y1="80" x2="170" y2="80" stroke="#e2e8f0" stroke-opacity="0.15" stroke-dasharray="2 2" />
      
      <!-- Area glow under the chart line -->
      <path d="M 20 85 L 50 60 L 80 75 L 110 50 L 140 45 L 170 35 L 170 95 L 20 95 Z" fill="url(#glow-grad)" />
      
      <!-- Chart line -->
      <path d="M 20 85 L 50 60 L 80 75 L 110 50 L 140 45 L 170 35" fill="none" stroke="url(#accent-grad-1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Chart dots -->
      <circle cx="20" cy="85" r="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
      <circle cx="80" cy="75" r="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
      <circle cx="140" cy="45" r="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
      <circle cx="170" cy="35" r="3.5" fill="url(#accent-grad-1)" stroke="#ffffff" stroke-width="1.5" />

      <!-- Pie Chart Card (Course Ratio ring) -->
      <rect x="196" y="0" width="98" height="110" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="206" y="16" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#475569">COURSE RATIO</text>
      
      <!-- Doughnut circle rendering -->
      <circle cx="245" cy="58" r="28" fill="none" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="8" />
      
      <!-- Doughnut segments -->
      <circle cx="245" cy="58" r="28" fill="none" stroke="#4f46e5" stroke-width="8" stroke-dasharray="176" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90 245 58)" />
      <circle cx="245" cy="58" r="28" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="176" stroke-dashoffset="135" stroke-linecap="round" transform="rotate(20 245 58)" />
      <circle cx="245" cy="58" r="28" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="176" stroke-dashoffset="155" stroke-linecap="round" transform="rotate(120 245 58)" />
      
      <text x="245" y="61" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1e293b" text-anchor="middle">35%</text>
    </g>

    <!-- Academic Subjects Table Mockup (Bottom Right) -->
    <g transform="translate(145, 180)">
      <rect x="0" y="0" width="294" height="105" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      
      <!-- Table Header -->
      <rect x="0" y="0" width="294" height="24" rx="12" fill="#ffffff" fill-opacity="0.4" />
      <text x="12" y="15" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#475569">SUBJECT NAME</text>
      <text x="160" y="15" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">ATTENDANCE</text>
      <text x="215" y="15" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">MARK / 100</text>
      <text x="265" y="15" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">GRADE</text>
      
      <!-- Table Row 1 -->
      <g transform="translate(0, 24)">
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#1e293b">☕ Java Programming</text>
        <text x="160" y="18" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">92%</text>
        <text x="215" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#4f46e5" text-anchor="middle">90</text>
        <rect x="250" y="8" width="30" height="13" rx="4" fill="#22c55e" fill-opacity="0.1" />
        <text x="265" y="18" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#22c55e" text-anchor="middle">A+</text>
      </g>
      
      <line x1="10" y1="49" x2="284" y2="49" stroke="#e2e8f0" stroke-opacity="0.2" stroke-width="1" />

      <!-- Table Row 2 -->
      <g transform="translate(0, 50)">
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#1e293b">🐍 Python Development</text>
        <text x="160" y="18" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">95%</text>
        <text x="215" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#4f46e5" text-anchor="middle">94</text>
        <rect x="250" y="8" width="30" height="13" rx="4" fill="#22c55e" fill-opacity="0.1" />
        <text x="265" y="18" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#22c55e" text-anchor="middle">A+</text>
      </g>
      
      <line x1="10" y1="75" x2="284" y2="75" stroke="#e2e8f0" stroke-opacity="0.2" stroke-width="1" />

      <!-- Table Row 3 -->
      <g transform="translate(0, 76)">
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#1e293b">🤖 Machine Learning</text>
        <text x="160" y="18" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">89%</text>
        <text x="215" y="18" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#4f46e5" text-anchor="middle">82</text>
        <rect x="250" y="8" width="30" height="13" rx="4" fill="#06b6d4" fill-opacity="0.1" />
        <text x="265" y="18" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#06b6d4" text-anchor="middle">A</text>
      </g>
    </g>

  </g>
</svg>
